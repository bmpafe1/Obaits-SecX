# ModSecurity configuration for the Obaits platform.
#
# THIS IS A COPY OF /etc/nginx/modsec/main.conf ON THE VPS. It is NOT deployed
# from here -- nginx reads the file at that path directly, and nothing in the
# deploy script touches it. This copy exists because until 2026-08-30 the file
# lived ONLY on the VPS: a rebuilt server would have lost every exception below,
# and the only record of why they exist was a session log.
#
# TO CHANGE IT: edit on the VPS, run `sudo nginx -t`, reload, and then copy the
# file back here so the two do not drift. Drift is the failure mode to watch --
# a repo copy that no longer matches production is worse than none, because it
# is trusted.
#
# WHY THE EXCEPTIONS EXIST. The platform serves shell and PowerShell scripts to
# enrolling devices, and CRS blocks them by default:
#
#   950140  fires on any served SHELL SCRIPT BODY -- it reads a legitimate
#           installer as an attempted command injection
#   920440  blocks URLs ending in .sh
#
# Every /enroll/ route that serves a script therefore needs an exception, and
# THREE PLACES must agree for such a route to work at all: routes/web.php, the
# CSRF exemption in bootstrap/app.php, and this file. Forgetting this one gives
# a silent failure with nothing in the Laravel log, because the request never
# reaches PHP.
#
# ORDERING MATTERS, and it is not obvious -- see the comment at the exception
# for /enroll/assets/. ctl:ruleRemoveById must be evaluated BEFORE the Include
# that defines the target rule. An exception placed after the Include has
# nothing to remove and silently never takes effect.
#
# A `location` block carrying its own `modsecurity_rules` REPLACES the inherited
# context rather than adding to it, so exceptions defined here do not apply
# inside such a block.
#
# Copied verbatim 2026-08-30. Do not edit this copy expecting it to take effect.

Include /etc/nginx/modsec/modsecurity.conf
Include /etc/nginx/owasp-crs/crs-setup.conf
# /enroll/install.sh, /enroll/install.ps1, every /enroll/audit-*.sh /
# /enroll/audit-*.ps1 script, and /enroll/assets/* (Sysmon binary + config)
# are all Laravel routes returning our own enrollment content as plain
# downloads. CRS 920440 blocks script/binary extensions inbound (a real
# false positive — this is a GET-only content download, not code being
# uploaded); CRS 950140 treats script bodies as CGI source leakage
# outbound. Widened 2026-07-27 (Phase 4.1 Stage 2) to include
# /enroll/assets/ after Sysmon64.exe hit the same false positive
# audit-linux.sh did.
SecRule REQUEST_URI "@rx ^/enroll/((install|audit-[a-z]+)\.(sh|ps1)|assets/.+)$" \
    "id:1000001,phase:1,pass,nolog,ctl:ruleRemoveById=920440,ctl:ruleRemoveById=950140"

# /enroll/assets/* also needs 930130 excluded specifically — CRS's
# "Restricted File Access Attempt" rule matches the literal substring
# "config.xml" in any filename (the standard signature for probing
# wp-config/web.config-style files), which our own sysmonconfig.xml
# legitimately contains as a name, not an attack. Kept as its OWN rule
# id, scoped only to /enroll/assets/, rather than folded into the
# broader install/audit exclusion above, since 930130 is a real,
# valuable rule everywhere else on the site.
#
# MUST sit BEFORE the "Include .../rules/*.conf" line below — ctl:ruleRemoveById
# runs in file order within phase:1, and a remove instruction placed AFTER
# the Include that actually defines the target rule has nothing to remove
# yet. Confirmed the hard way: the first attempt at this exclusion sat
# after the Include and silently never took effect.
SecRule REQUEST_URI "@rx ^/enroll/assets/.+$" \
    "id:1000010,phase:1,pass,nolog,ctl:ruleRemoveById=930130"

# /enroll/role-credential is called by role-setup Fleet Scripts (e.g.
# mysql-db.ps1) via PowerShell's Invoke-WebRequest -Method POST, which
# automatically adds an "Expect: 100-continue" header for any POST with a
# body -- genuine, standard PowerShell behavior, not something our own
# script controls. CRS 920450 flags Expect as a restricted header by
# policy default, pushing the request's anomaly score over the block
# threshold (confirmed directly via modsec_audit.log for the real,
# specific failing request). Scoped to this one route only, not removed
# server-wide, since 920450 is a real, valuable rule everywhere else.
SecRule REQUEST_URI "@rx ^/enroll/role-credential$" \
    "id:1000011,phase:1,pass,nolog,ctl:ruleRemoveById=920450"
# /enroll/role-script has the SAME real cause as role-credential above --
# PowerShell's Invoke-WebRequest -Method POST automatically adds an
# "Expect: 100-continue" header, tripping CRS 920450. Same fix, same
# reasoning, own rule id.
SecRule REQUEST_URI "@rx ^/enroll/role-script$" \
    "id:1000012,phase:1,pass,nolog,ctl:ruleRemoveById=920450"
# /enroll/role-script serves REAL, complete role-setup script content as
# its response body (this is the whole point -- the real fix for
# Fleet's own script_contents transport limits). CRS 951240 flags
# genuine PostgreSQL error-message patterns leaking in a response body,
# a real, valuable rule for normal app responses -- but our own script's
# comments legitimately mention "PostgreSQL" and similar phrases,
# tripping a false positive on THIS route specifically. REAL BUG FOUND:
# a broader fix (ctl:responseBodyAccess=off) was attempted first, but
# that syntax is for ModSecurity v2 (Apache) -- this project runs
# ModSecurity v3 (ModSecurity-nginx), which rejected it outright and
# genuinely failed nginx -t (caught safely before any live reload
# happened -- nginx kept running its last-known-good config). Reverted
# to the narrower, confirmed-working single-rule removal instead. A
# more durable, version-correct broad fix is worth real research later,
# but not at the cost of another site-wide config-break risk tonight.
SecRule REQUEST_URI "@rx ^/enroll/role-script$" \
    "id:1000013,phase:4,pass,nolog,ctl:ruleRemoveById=951240"
# Exactly the recurring risk predicted when 951240 was first excluded
# above: a DIFFERENT script's real content (mysql-db.sh's own genuine
# shebang, "#!/bin/bash") tripped a DIFFERENT response-leakage rule,
# 950140 ("CGI source code leakage") this time. Same real cause, same
# real route, same safe, narrow, already-proven fix pattern -- adding
# rules one at a time as new scripts' own real content trips different
# stock rules remains the deliberate, safer choice over a broader
# directive change, given tonight's own real near-miss already proved
# how much more careful a site-wide response-body change needs to be.
SecRule REQUEST_URI "@rx ^/enroll/role-script$" \
    "id:1000014,phase:4,pass,nolog,ctl:ruleRemoveById=950140"
# REAL BUG FOUND on a real device: clicking "+ Add role" and selecting
# Docker Host tripped ModSecurity's own Remote Command Execution rule
# (932260) on the literal Livewire UI request itself, before any script
# was ever fetched -- the role's own real name, "docker-hosts", contains
# a real Unix command name ("docker") as a substring, and 932260 flagged
# that on the request BODY (a normal, trusted, internal Livewire AJAX
# update call), not anything attacker-controlled. Scoped narrowly to
# Livewire's own internal update endpoint (a general pattern, not the
# specific per-build asset hash confirmed on this device, since that
# hash could change on a future deployment) rather than the whole site,
# and to this one specific rule only -- every other route and every
# other RCE-detection rule stays fully active.
SecRule REQUEST_URI "@rx ^/livewire-[a-f0-9]+/update$" \
    "id:1000015,phase:2,pass,nolog,ctl:ruleRemoveById=932260"
# REAL BUG FOUND on a real device: assigning software to a device group
# and providing a real, legitimate silent-install command (e.g. "sudo
# dpkg -i %%INSTALLER_PATH%% || sudo apt-get install -f -y") tripped
# 932235 ("Remote Command Execution: Unix Command Injection") on the
# literal Livewire UI request itself -- a genuinely trusted, internal
# Livewire AJAX update call, not an attacker-controlled input. This is
# a real, intended feature: an admin must be able to specify a real
# shell install command, which the underlying rule is (correctly, in
# general) designed to catch. Same real, already-proven, safe pattern
# as 1000015 above: scoped to Livewire's own internal update endpoint
# only, and to this one specific rule only -- every other route and
# every other RCE-detection rule stays fully active.
SecRule REQUEST_URI "@rx ^/livewire-[a-f0-9]+/update$" \
    "id:1000016,phase:2,pass,nolog,ctl:ruleRemoveById=932235"
# REAL BUG FOUND on a real device: Keycloak's own Admin REST API (and its
# own Admin Console UI, which calls the same API) genuinely requires PUT
# and DELETE for normal, real administrative operations (updating a
# client's config, deleting a user, etc.) -- CRS 911100's own default
# allow-list (GET HEAD POST OPTIONS) blocked ALL of these, confirmed
# directly: both a real browser save attempt in the Keycloak Admin
# Console AND our own backend's server-side PUT call hit the identical
# real 403. Scoped narrowly to Keycloak's own real, specific Admin REST
# API path (/admin/realms/...) only -- every other route and every
# other method-enforcement check stays fully active.
SecRule REQUEST_URI "@rx ^/admin/realms/" \
    "id:1000017,phase:1,pass,nolog,ctl:ruleRemoveById=911100"

# REAL BUG FOUND 2026-08-07: CRS response-side rule 950140 ("CGI source
# code leakage") fires because /enroll/policy-script's entire real
# purpose is to serve real shell/PowerShell script content, which
# legitimately starts with a shebang line (#!/bin/bash) -- exactly the
# pattern this rule exists to catch on an ACCIDENTAL source-code leak.
# Confirmed directly: this pushed TX:BLOCKING_OUTBOUND_ANOMALY_SCORE to
# 4, crossing rule 959100's blocking threshold in phase 4 -- AFTER nginx
# had already begun streaming the response, producing "header already
# sent" server-side and "curl: (52) Empty reply from server" /
# "SSL_read: unexpected eof" on the real device, on every real attempt.
# Scoped narrowly to this one route only -- every other route keeps full
# response-side leakage detection.
SecRule REQUEST_URI "@rx ^/enroll/policy-script$" \
    "id:1000018,phase:1,pass,nolog,ctl:ruleRemoveById=950140"

# REAL BUG FOUND 2026-08-12: CRS rule 920450 ("HTTP header is restricted
# by policy") blocks any request carrying an Expect header -- PowerShell's
# Invoke-WebRequest sends "Expect: 100-continue" on every POST by default,
# completely standard .NET/Windows HTTP client behaviour, not an attack.
# curl on Linux does not send this header by default, which is exactly
# why /enroll/policy-script's identical Linux traffic never tripped this --
# this is the FIRST time this route was ever hit from a real Windows
# device. Confirmed directly: a single Warning at severity 2 pushed
# TX:BLOCKING_INBOUND_ANOMALY_SCORE to 5, over the phase-2 blocking
# threshold (949110), on the exact real check-policy fetch from
# WIN-2UQ47DD9KL4.AICEXPERTS.LOCAL. Scoped narrowly to this one route only
# -- every other route keeps full Expect-header restriction.
SecRule REQUEST_URI "@rx ^/enroll/policy-script$" \
    "id:1000019,phase:1,pass,nolog,ctl:ruleRemoveById=920450"

# REAL BUG FOUND 2026-08-12, same root cause as the 1000019 exclusion
# immediately above: check.ps1's own result POST-back to
# /enroll/policy-result hit the identical CRS 920450 "Expect header
# restricted" block -- confirmed directly, the check itself succeeded
# and correctly read real firewall state (firewall_disabled), but the
# POST reporting that result back was silently denied by the WAF before
# ever reaching our route. Scoped narrowly to this one route only.
SecRule REQUEST_URI "@rx ^/enroll/policy-result$" \
    "id:1000020,phase:1,pass,nolog,ctl:ruleRemoveById=920450"

# REAL BUG FOUND 2026-08-16: CRS rule 920440 ("URL file extension is
# restricted by policy") blocks ANY request whose URL ends in a
# restricted extension list, which includes .sh -- confirmed directly,
# this blocked /enroll/threat-intel-refresh.sh outright with a plain
# GET request, before Laravel ever saw it. install.sh's own identical
# .sh route has presumably worked around this some other way or simply
# never been retested against this specific rule; this exclusion is
# scoped narrowly to the one new route rather than assumed to already
# be covered.
SecRule REQUEST_URI "@rx ^/enroll/threat-intel-refresh\.sh$" \
    "id:1000021,phase:1,pass,nolog,ctl:ruleRemoveById=920440,ctl:ruleRemoveById=950140"

# REAL BUG FOUND 2026-08-23: /enroll/timer-setup serves a shell script that
# installs a systemd timer, and hit CRS 950140 ("source code disclosure") in
# the OUTBOUND phase -- the response streamed, ModSecurity killed it mid-flight,
# and the client saw only "curl: (52) Empty reply from server" with nothing in
# the Laravel log. The route was deliberately named without a .sh extension to
# avoid 920440, and that worked -- but 950140 inspects the BODY, so any route
# serving a shell script needs this regardless of its URL. Same exclusion as
# 1000021 above, scoped to this one route.
SecRule REQUEST_URI "@rx ^/enroll/timer-setup$" \
    "id:1000023,phase:1,pass,nolog,ctl:ruleRemoveById=950140"

# REAL BUG FOUND 2026-08-19, reported live by Brian and traced end to
# end: the Wazuh dashboard's own real, legitimate call to its own
# Manager API (POST /api/check-api, checking the configured host
# https://127.0.0.1) was being flagged by CRS rule 931100 ("Possible
# Remote File Inclusion Attack: URL Parameter using IP Address") --
# a genuine false positive, since a raw-IP loopback URL in this
# specific dashboard-to-Manager health-check call is completely
# legitimate, not an actual RFI attempt. Scoped narrowly to this one
# real route, not a broad exclusion.
SecRule REQUEST_URI "@rx ^/api/check-api$" \
    "id:1000022,phase:1,pass,nolog,ctl:ruleRemoveById=931100"
Include /etc/nginx/owasp-crs/rules/*.conf
