server {
    listen 80;
    server_name app.obaits.com auth.obaits.com grc.obaits.com fleet.obaits.com wazuh.obaits.com zabbix.obaits.com;
    # REAL BUG FOUND on a real device: certbot's ACME challenge requests
    # (plain HTTP, by protocol design) were being unconditionally
    # redirected to HTTPS before reaching any location that could serve
    # them -- confirmed directly, every domain's challenge failed with a
    # DIFFERENT real error, each matching that domain's own generic
    # backend proxy (Fleet's 404, Wazuh's 401, etc.), since the redirect
    # sent certbot's request to HTTPS, where the same generic location /
    # then proxied the still-unmatched request onward. Real fix: serve
    # the real challenge files directly, over plain HTTP, before the
    # redirect ever applies.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name auth.obaits.com;
    ssl_certificate     /etc/letsencrypt/live/app.obaits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.obaits.com/privkey.pem;
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name fleet.obaits.com;
    ssl_certificate     /etc/letsencrypt/live/app.obaits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.obaits.com/privkey.pem;
    # Machine-to-machine agent/API traffic only -- browser-oriented CRS blocking
    # breaks orbit token rotation (device_token 403 crash-loop, 2026-07-21).
    # Detection-only: keep the logs, stop the blocking.
    modsecurity on;
    modsecurity_rules 'SecRuleEngine DetectionOnly';
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_set_header Host $host;
    }
}
server {
    listen 443 ssl;
    server_name zabbix.obaits.com;
    ssl_certificate     /etc/letsencrypt/live/app.obaits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.obaits.com/privkey.pem;
    # REAL BUG FOUND on a real device: both Zabbix's own real API endpoint
    # (/api_jsonrpc.php, used by our own backend) and its own internal
    # dashboard AJAX endpoint (/jsrpc.php, used by the normal web UI
    # itself) were genuinely blocked -- confirmed directly, real JSON-RPC
    # request bodies tripped ModSecurity's generic anomaly-scoring rules.
    # Same real, already-proven fix already used for fleet.obaits.com
    # (machine-to-machine API traffic): detection-only, keep the logs,
    # stop the blocking.
    modsecurity on;
    modsecurity_rules 'SecRuleEngine DetectionOnly';
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 443 ssl;
    server_name grc.obaits.com;
    ssl_certificate     /etc/letsencrypt/live/app.obaits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.obaits.com/privkey.pem;
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name grc.obaits.com;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}

server {
    listen 443 ssl;
    server_name wazuh.obaits.com;
    ssl_certificate     /etc/letsencrypt/live/app.obaits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.obaits.com/privkey.pem;
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
    location / {
        proxy_pass https://127.0.0.1:444;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
    }
}
server {
    listen 443 ssl;
    server_name app.obaits.com;
    ssl_certificate     /etc/letsencrypt/live/app.obaits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.obaits.com/privkey.pem;
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
    root /var/www/obaits/public;
    index index.php;
    client_max_body_size 64M;
    location = /enroll/role-script {
        modsecurity_rules 'SecResponseBodyAccess Off';
        try_files $uri $uri/ /index.php?$query_string;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
}
